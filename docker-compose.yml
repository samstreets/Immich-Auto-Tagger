# ---------------------------------------------------------------------------
# docker-compose.yml — Auto-Tagger service only
#
# Assumes Immich is already running. Attach this service to whichever
# network your Immich stack uses (default: immich_default).
# ---------------------------------------------------------------------------

volumes:
  tagger-state:   # persists last_run.json across restarts

services:
  immich-auto-tagger:
    image: samuelstreets/immich-auto-tagger:latest
    container_name: immich_auto_tagger
    environment:
      # ----- Required -------------------------------------------------------
      IMMICH_URL: "http://immich_server:2283"   # Immich container name/hostname
      IMMICH_API_KEY: "${IMMICH_API_KEY}"        # set in .env or shell

      # ----- Optional (shown with defaults) ---------------------------------
      SCAN_INTERVAL_MINUTES: "15"
      SCAN_PAGE_SIZE: "100"
      INITIAL_SCAN_DAYS: "0"                    # 0 = all assets on first run
      IMMICH_TIMEOUT: "30"

      # ----- Object tagging (optional) --------------------------------------
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"   # omit to disable object tags
      # OBJECT_TAG_MAX_LABELS: "5"

    volumes:
      - tagger-state:/app/state

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M